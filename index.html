  <script>
    (function () {
      try {
        const params = new URLSearchParams(window.location.search);
        const ncc = params.get('ncc');

        if (ncc) {
          const cachedTitle = localStorage.getItem('SHOP_TITLE_' + ncc);
          const cachedIcon = localStorage.getItem('SHOP_ICON_' + ncc);

          if (cachedTitle) {
            document.title = cachedTitle;
          } else {
            document.title = 'SA KITCHEN';
          }

          if (cachedIcon) {
            var link = document.querySelector("link[rel~='icon']");
            if (!link) {
              link = document.createElement('link');
              link.rel = 'icon';
              link.type = 'image/jpeg';
              document.head.appendChild(link);
            }
            link.href = cachedIcon;
          } else {
            var link = document.querySelector("link[rel~='icon']");
            if (!link) {
              link = document.createElement('link');
              link.rel = 'icon';
              link.type = 'image/jpeg';
              document.head.appendChild(link);
            }
            link.href = '/logo-sa.jpg';
          }
        } else {
          document.title = 'SA KITCHEN';
          var link = document.querySelector("link[rel~='icon']");
          if (!link) {
            link = document.createElement('link');
            link.rel = 'icon';
            link.type = 'image/jpeg';
            document.head.appendChild(link);
          }
          link.href = '/logo-sa.jpg';
        }
      } catch (e) {
        document.title = 'SA KITCHEN';
      }
    })();
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    /* LOADING SCREEN */
    #app-loader {
      position: fixed;
      inset: 0;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loader-spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(5, 150, 105, 0.16);
      border-top-color: #059669;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Prevent mobile zoom (pinch, double-tap & iOS Safari auto-zoom on input focus) */
    @media (max-width: 768px), (hover: none) and (pointer: coarse) {
      html,
      body,
      #app,
      * {
        touch-action: pan-x pan-y;
      }

      input,
      textarea,
      select {
        font-size: 16px !important;
      }

      input.small-text,
      textarea.small-text {
        font-size: 16px !important;
        transform: scale(0.875);
        transform-origin: left top;
      }
    }
  </style>
</head>

<body>
  <!-- LOADING SCREEN -->
  <div id="app-loader">
    <div class="loader-spinner"></div>
  </div>

  <div id="app"></div>

  <script type="module" src="/src/main.ts"></script>

  <!-- HIDE LOADER ON MOUNT -->
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var loader = document.getElementById('app-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.25s ease';
          setTimeout(function () {
            loader.remove();
          }, 260);
        }
      }, 80);
    });
  </script>
  <!-- BLOCK MOBILE PINCH & GESTURE ZOOM (iOS Safari / WebView) -->
  <script>
    (function () {
      var isMobileViewport = function () {
        return window.innerWidth <= 768 ||
          (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
      };
      var preventPinch = function (e) {
        if (!isMobileViewport()) return;
        if (e.cancelable) e.preventDefault();
      };
      var preventMultiTouch = function (e) {
        if (!isMobileViewport()) return;
        if (e.touches && e.touches.length > 1 && e.cancelable) {
          e.preventDefault();
        }
      };
      document.addEventListener('gesturestart', preventPinch, { passive: false });
      document.addEventListener('gesturechange', preventPinch, { passive: false });
      document.addEventListener('gestureend', preventPinch, { passive: false });
      document.addEventListener('touchstart', preventMultiTouch, { passive: false });
      document.addEventListener('touchmove', preventMultiTouch, { passive: false });
    })();
  </script>
</body>
