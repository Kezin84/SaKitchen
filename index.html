  </div>
  <script>
    (function () {
      try {
        var path = (window.location.pathname || '').toLowerCase();
        var params = new URLSearchParams(window.location.search);
        var tgStart = params.get('tgWebAppStartParam') || '';
        var isStorefront = !path.startsWith('/admin') && !path.startsWith('/login') && !path.startsWith('/blog') && !params.get('order') && tgStart.indexOf('order_') !== 0;
        if (!isStorefront) return;
        var rawTheme = localStorage.getItem('SA_STOREFRONT_THEME_V1');
        var mode = 'once_session';
        var loaderBg = 'radial-gradient(circle at 50% 45%, #4b1008 0%, #180504 65%, #090202 100%)';
        if (rawTheme) {
          var parsed = JSON.parse(rawTheme);
          if (parsed && parsed.introSplashMode) mode = parsed.introSplashMode;
          if (parsed && parsed.introLoaderBg) loaderBg = parsed.introLoaderBg;
        }
        var shouldSplash =
          mode === 'always' ||
          (mode !== 'off' && sessionStorage.getItem('SA_INTRO_SPLASH_SHOWN') !== '1');
        if (shouldSplash) {
          var loader = document.getElementById('app-loader');
          if (loader) {
            loader.style.background = loaderBg;
            var sp = loader.querySelector('.loader-spinner');
            if (sp) sp.style.display = 'none';
          }
        }
      } catch (e) {}
    })();
  </script>

  <!-- HIDE LOADER ON MOUNT -->
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var loader = document.getElementById('app-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.25s ease';
          setTimeout(function () {
            loader.remove();
          }, 260);
        }
      }, 80);
    });
  </script>
  <!-- BLOCK MOBILE PINCH & GESTURE ZOOM (iOS Safari / WebView) -->
  <script>
    (function () {
      var isMobileViewport = function () {
        return window.innerWidth <= 768 ||
          (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
      };
      var preventPinch = function (e) {
        if (!isMobileViewport()) return;
        if (e.cancelable) e.preventDefault();
      };
      var preventMultiTouch = function (e) {
        if (!isMobileViewport()) return;
        if (e.touches && e.touches.length > 1 && e.cancelable) {
          e.preventDefault();
        }
      };
      document.addEventListener('gesturestart', preventPinch, { passive: false });
      document.addEventListener('gesturechange', preventPinch, { passive: false });
      document.addEventListener('gestureend', preventPinch, { passive: false });
      document.addEventListener('touchstart', preventMultiTouch, { passive: false });
      document.addEventListener('touchmove', preventMultiTouch, { passive: false });
    })();
  </script>
